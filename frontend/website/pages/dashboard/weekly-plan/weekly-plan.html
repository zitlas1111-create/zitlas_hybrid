<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ZITLAS — Weekly Wellness Plan</title>
  <link rel="stylesheet" href="weekly-plan.css?v=20260726" />
  <link rel="stylesheet" href="../../../assets/css/theme.css" />
  <link rel="stylesheet" href="../../../assets/css/coaching-workspace.css?v=20260825a" />
  <link rel="stylesheet" href="../../../assets/css/zino.css?v=20260706" />
  <link rel="stylesheet" href="../../../assets/css/verified-badge.css?v=20260714" />
  <script src="../../../assets/js/i18n.js"></script>
  <script src="../../../assets/js/verified-badge.js?v=20260714"></script>
  <!-- Firebase: needed for Personal Coaching mode (coach-managed training, realtime) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="../../../assets/js/firebase-config.js?v=20260718a"></script>
  <script src="../../../assets/js/payment-service.js?v=20260722"></script>
  <script src="../../../assets/js/cloud-sync.js?v=20260718d"></script>
  <script src="../../../assets/js/notification-center.js?v=20260714"></script>
</head>
<body class="zitlas-premium-bg">

  <!-- ════════════ STICKY HEADER ════════════ -->
  <header class="wp-header">
    <button class="wp-back-btn" id="wpBackBtn" aria-label="Back to Dashboard">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
    </button>
    <div class="wp-header-center">
      <span class="wp-header-tag" data-i18n="wp_header_tag">WEEKLY PLAN</span>
    </div>
    <img src="/assets/logo.png" alt="ZITLAS Logo" class="wp-header-logo">
  </header>

  <!-- ════════════ PAGE ════════════ -->
  <div class="wp-page" id="wpPage">

    <!-- Loading state -->
    <div class="wp-loading" id="wpLoading">
      <span class="wp-loading-icon">📉</span>
      <p class="wp-loading-text" data-i18n="wp_loading">Loading your plan…</p>
    </div>

    <!-- Main content (hidden until rendered) -->
    <div class="wp-content" id="wpContent">

      <!-- ── HERO ── -->
      <div class="wp-hero" id="wpHero">
        <!-- Populated by JS -->
      </div>

      <!-- ── PLAN CONTEXT BAR ── -->
      <div class="wp-context-bar" id="wpContextBar">
        <!-- Populated by JS — always shown -->
      </div>

      <!-- ── WEEK PROGRESS ── -->
      <div id="wpWeekProgress">
        <!-- Populated by JS -->
      </div>

      <!-- ── AI ANALYSIS STRIP ── -->
      <div class="wp-analysis-wrap" id="wpAnalysisWrap">
        <!-- Populated by JS when AI-enhanced data exists -->
      </div>

      <!-- ── 7-DAY SCHEDULE ── -->
      <section class="wp-schedule-section">
        <div class="wp-schedule-hd">
          <span class="wp-schedule-hd-icon">📅</span>
          <h2 class="wp-schedule-title" data-i18n="wp_schedule">7-Day Schedule</h2>
        </div>
        <div class="wp-day-list" id="wpDayList">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- ── WEEKLY REVIEW ── -->
      <div class="wp-review-wrap" id="wpReviewWrap">
        <!-- Populated by JS when weeklyReview data exists -->
      </div>

      <!-- ── BOTTOM CTA ── -->
      <div class="wp-cta">
        <button class="wp-cta-btn" id="wpBackToDash" data-i18n="wp_back_to_dash">← Back to Dashboard</button>
      </div>

    </div><!-- /.wp-content -->
  </div><!-- /.wp-page -->

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="../../../components/wallet.js?v=20260718"></script>
  <script src="../../../components/navbar.js?v=20260718a"></script>
  <script src="weekly-plan.js?v=20260716c"></script>
  <script src="../../../assets/js/zino.js?v=20260805a"></script>
</body>
</html>
