<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Modify Diet Plan — ZITLAS</title>
  <link rel="stylesheet" href="expert-dashboard.css"/>
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <link rel="stylesheet" href="" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif); min-height: 100dvh; display: flex; flex-direction: column; }

    .mp-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      background: rgba(10,10,10,0.95);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }
    .mp-back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(var(--white-rgb),0.06);
      color: var(--text);
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .mp-back:active { background: rgba(var(--white-rgb),0.12); }
    .mp-title { font-size: 16px; font-weight: 700; color: var(--text); flex: 1; }

    .mp-athlete-bar {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-sec);
      flex-shrink: 0;
    }
    .mp-athlete-name { font-weight: 600; color: var(--text); }

    .mp-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      padding-bottom: 100px;
      -webkit-overflow-scrolling: touch;
    }

    /* Day card */
    .mp-day-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 14px;
    }
    .mp-day-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Meal block */
    .mp-meal-block { margin-bottom: 16px; }
    .mp-meal-block:last-child { margin-bottom: 0; }
    .mp-meal-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .mp-meal-emoji { font-size: 16px; }
    .mp-meal-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sec);
      text-transform: capitalize;
    }

    /* Meal name editable */
    .mp-meal-name-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      outline: none;
      padding-bottom: 2px;
      width: 160px;
      transition: border-color 0.15s;
    }
    .mp-meal-name-input:focus { border-bottom-color: var(--accent); }

    /* Foods list */
    .mp-food-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
    }
    .mp-food-input {
      flex: 1;
      background: rgba(var(--white-rgb),0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      padding: 8px 10px;
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .mp-food-input:focus { border-color: var(--accent); }
    .mp-food-remove {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(239,68,68,0.08);
      color: var(--primary-dark);
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .mp-food-remove:active { background: rgba(239,68,68,0.18); }
    .mp-add-food {
      margin-top: 4px;
      padding: 7px 10px;
      font-size: 12px;
      color: var(--text-muted);
      border: 1px dashed var(--border);
      border-radius: var(--radius-xs);
      background: transparent;
      transition: border-color 0.15s, color 0.15s;
    }
    .mp-add-food:active { border-color: var(--accent); color: var(--accent); }

    .mp-meal-divider {
      height: 1px;
      background: var(--border);
      margin: 14px 0;
      opacity: 0.5;
    }

    /* Footer */
    .mp-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 14px;
      background: rgba(10,10,10,0.97);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    .mp-btn {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      transition: opacity 0.15s, transform 0.15s;
    }
    .mp-btn:active { opacity: 0.85; transform: scale(0.98); }
    .mp-btn--save     { background: var(--accent); color: var(--bg-primary); }
    .mp-btn--complete { background: var(--success); color: var(--bg-primary); }
    /* Completed / in-flight: visibly inert so a second submission never
       looks available. */
    .mp-btn--complete:disabled { opacity: .6; cursor: not-allowed; }
    .mp-btn--done { background: var(--border); color: var(--text-sec); }

    .mp-toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: rgba(30,30,30,0.96);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      box-shadow: 0 4px 20px rgba(var(--black-rgb),0.4);
      border: 1px solid var(--border);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s, transform 0.22s;
      z-index: 100;
    }
    .mp-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Athlete context panel + review notes ── */
    .mp-ctx-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 14px;
      overflow: hidden;
    }
    .mp-ctx-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      background: rgba(var(--white-rgb),0.03);
    }
    .mp-ctx-toggle {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: transparent;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .mp-ctx-body { padding: 6px 16px 12px; }
    .mp-ctx-section { padding: 8px 0; }
    .mp-ctx-section + .mp-ctx-section { border-top: 1px solid var(--border); }
    .mp-ctx-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .mp-ctx-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 3px 0;
      font-size: 13px;
    }
    .mp-ctx-label { color: var(--text-muted); flex-shrink: 0; }
    .mp-ctx-value { color: var(--text); font-weight: 600; text-align: right; text-transform: capitalize; }

    .mp-notes-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .mp-notes-input {
      width: 100%;
      background: rgba(var(--white-rgb),0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      padding: 10px 12px;
      font-size: 13px;
      color: var(--text);
      font-family: inherit;
      line-height: 1.5;
      outline: none;
      resize: vertical;
      transition: border-color 0.15s;
    }
    .mp-notes-input:focus { border-color: var(--accent); }
  </style>
</head>
<body>

  <header class="mp-header">
    <button class="mp-back" id="mpBack" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
    </button>
    <h1 class="mp-title">Modify Diet Plan</h1>
  </header>

  <div class="mp-user-bar">
    Reviewing plan for <span class="mp-athlete-name" id="mpAthleteName">User</span>
  </div>

  <div class="mp-body" id="mpBody"></div>

  <div class="mp-footer">
    <!-- ONE primary action. The separate Save button was removed: it gated
         Complete behind itself (Save hid itself and revealed Complete), so a
         Save that early-returned left Complete permanently invisible. -->
    <button class="mp-btn mp-btn--complete" id="mpComplete">Save &amp; Complete Review</button>
  </div>

  <div class="mp-toast" id="mpToast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="../../assets/js/firebase-config.js?v=20260718a"></script>
  <!-- Auth bridge + native-feel chrome suppression when reached inside the
       Flutter coaching WebView (coach edits a diet from the dashboard). -->
  <script src="../../assets/js/webview-bridge.js?v=20260807"></script>
  <script src="modify-diet.js?v=20260718a"></script>
</body>
</html>
