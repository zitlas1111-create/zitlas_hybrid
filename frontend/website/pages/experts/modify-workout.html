<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Modify Workout Plan — ZITLAS</title>
  <link rel="stylesheet" href="expert-dashboard.css"/>
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <link rel="stylesheet" href="" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif); min-height: 100dvh; display: flex; flex-direction: column; }

    /* ── Header ── */
    .mp-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      background: rgba(10,10,10,0.95);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }
    .mp-back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(var(--white-rgb),0.06);
      color: var(--text);
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .mp-back:active { background: rgba(var(--white-rgb),0.12); }
    .mp-title { font-size: 16px; font-weight: 700; color: var(--text); flex: 1; }

    /* ── Athlete bar ── */
    .mp-athlete-bar {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-sec);
      flex-shrink: 0;
    }
    .mp-athlete-name { font-weight: 600; color: var(--text); }

    /* ── Scrollable body ── */
    .mp-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      padding-bottom: 100px;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Day card ── */
    .mp-day-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 14px;
    }
    .mp-day-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .mp-field-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .mp-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      width: 80px;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .mp-input {
      flex: 1;
      background: rgba(var(--white-rgb),0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      padding: 9px 11px;
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .mp-input:focus { border-color: var(--accent); }
    .mp-input--short { width: 90px; flex: none; }

    /* ── Exercises ── */
    .mp-exercises-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 14px 0 8px;
    }
    .mp-ex-row {
      display: grid;
      grid-template-columns: 1fr 56px 90px 28px;
      gap: 6px;
      margin-bottom: 6px;
      align-items: center;
    }
    .mp-ex-name { grid-column: 1; }
    .mp-ex-sets { grid-column: 2; text-align: center; }
    .mp-ex-reps { grid-column: 3; }
    .mp-ex-remove {
      grid-column: 4;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(239,68,68,0.1);
      color: var(--primary-dark);
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .mp-ex-remove:active { background: rgba(239,68,68,0.2); }
    .mp-add-ex {
      margin-top: 10px;
      width: 100%;
      padding: 9px;
      border-radius: var(--radius-xs);
      border: 1px dashed var(--border);
      color: var(--text-muted);
      font-size: 13px;
      background: transparent;
      transition: border-color 0.15s, color 0.15s;
    }
    .mp-add-ex:active { border-color: var(--accent); color: var(--accent); }

    /* ── Sticky footer ── */
    .mp-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 14px;
      background: rgba(10,10,10,0.97);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    .mp-btn {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      transition: opacity 0.15s, transform 0.15s;
    }
    .mp-btn:active { opacity: 0.85; transform: scale(0.98); }
    .mp-btn--save { background: var(--accent); color: var(--bg-primary); }
    .mp-btn--complete { background: var(--success); color: var(--bg-primary); }
    /* Completed / in-flight: visibly inert so a second submission never
       looks available. */
    .mp-btn--complete:disabled { opacity: .6; cursor: not-allowed; }
    .mp-btn--done { background: var(--border); color: var(--text-sec); }

    /* ── Toast ── */
    .mp-toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: rgba(30,30,30,0.96);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      box-shadow: 0 4px 20px rgba(var(--black-rgb),0.4);
      border: 1px solid var(--border);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s, transform 0.22s;
      z-index: 100;
    }
    .mp-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Column headers for exercises ── */
    .mp-ex-cols {
      display: grid;
      grid-template-columns: 1fr 56px 90px 28px;
      gap: 6px;
      margin-bottom: 4px;
    }
    .mp-ex-col-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <header class="mp-header">
    <button class="mp-back" id="mpBack" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
    </button>
    <h1 class="mp-title">Modify Workout Plan</h1>
  </header>

  <div class="mp-athlete-bar">
    Reviewing plan for <span class="mp-athlete-name" id="mpAthleteName">Athlete</span>
  </div>

  <div class="mp-body" id="mpBody"></div>

  <div class="mp-footer">
    <!-- ONE primary action. The separate Save button was removed: it gated
         Complete behind itself (Save hid itself and revealed Complete), so a
         Save that early-returned left Complete permanently invisible. -->
    <button class="mp-btn mp-btn--complete" id="mpComplete">Save &amp; Complete Review</button>
  </div>

  <div class="mp-toast" id="mpToast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="../../assets/js/firebase-config.js?v=20260718a"></script>
  <!-- Auth bridge + native-feel chrome suppression when reached inside the
       Flutter coaching WebView (coach edits a workout from the dashboard). -->
  <script src="../../assets/js/webview-bridge.js?v=20260807"></script>
  <script src="modify-workout.js?v=20260718a"></script>
</body>
</html>
