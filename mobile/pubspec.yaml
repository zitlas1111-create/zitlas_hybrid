name: zitlas_mobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_messaging: ^16.4.3
  http: ^1.6.0
  # Explicit dependency (was previously only transitive via http) — used
  # directly by ApiClient.postMultipartBytes to set a real Content-Type on
  # multipart uploads instead of package:http's default application/octet-stream.
  http_parser: ^4.1.2
  shared_preferences: ^2.5.5
  go_router: ^17.3.0
  provider: ^6.1.5+1
  cached_network_image: ^3.4.1
  image_picker: ^1.2.3
  permission_handler: ^12.0.3
  flutter_secure_storage: ^10.3.1
  intl: ^0.20.3
  google_sign_in: ^7.2.0
  flutter_svg: ^2.3.0
  share_plus: ^13.3.0
  geolocator: ^14.0.3
  flutter_local_notifications: ^22.2.0
  workmanager: ^0.9.0+3
  audioplayers: ^6.8.1
  record: ^7.1.1
  flutter_tts: ^4.2.5
  path_provider: ^2.1.6
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  razorpay_flutter: ^1.4.5
  firebase_storage: ^13.4.6
  flutter_image_compress: ^2.5.1
  # Personal Coaching is served by the Website inside a secure, chromeless
  # WebView (see lib/features/coaching_webview/) until native Flutter reaches
  # feature parity. webview_flutter_android is pinned explicitly because the
  # coaching screen uses its AndroidWebViewController for the file chooser
  # (chat image upload) and geolocation/permission callbacks.
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.9.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Declared explicitly (it was already present transitively) because
  # test/splash_gate_test.dart imports it directly to elapse the splash gate's
  # timer without waiting in real time.
  fake_async: ^1.3.3

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.2.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Migrated 1:1 from frontend/assets/{logo.png,loginbg.png} — the real
  # ZITLAS website auth-page assets, not new artwork.
  assets:
    - assets/images/logo.png
    # The loading graphic (neon runner badge) shown while a Website WebView
    # loads — see core/widgets/zitlas_loading_ring.dart. Listed individually
    # like the rest; the assets block names files, not the directory.
    - assets/images/lodo.png
    - assets/images/loginbg.png
    - assets/images/homebg.png
    - assets/images/zino.png
    - assets/images/zino_intro.png
    - assets/images/zino_done.png
    # Rest Timer completion chime — a synthesized two-note ascending sine
    # tone (E6->A6, ~0.6s), not a licensed/stock sound. Played via audioplayers
    # (already a dependency) only while the app is foregrounded; the
    # background/locked-screen case relies on the scheduled notification's own
    # OS-level sound instead — see RestTimerController.
    - assets/sounds/rest_timer_complete.wav

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Android launcher icon, generated from the real ZITLAS logo
# (assets/images/logo.png) via `dart run flutter_launcher_icons`. The two
# source files under assets/icon/ are the same unaltered logo artwork,
# uniformly scaled (no stretch) and centered on a square canvas so it isn't
# distorted and sits inside Android's adaptive-icon safe zone:
#   - logo_icon.png        transparent bg -> adaptive icon foreground
#   - logo_icon_legacy.png flattened bg   -> legacy (pre-API-26) icon
# #234B35 is ZitlasColors.primary — the app's own documented "Primary
# ZITLAS green" (lib/app/theme.dart), the same green already used for the
# logo's own swoosh accents and for buttons/shadows across the app. A
# SOLID black adaptive-icon background (#000000, the old value here) reads
# as a stark black square/blob on the home screen next to every other
# app's colored icon card — this brand green gives the white "Z"
# foreground the same dark contrast black provided, without the "broken
# icon" look. logo_icon_legacy.png is a flattened composite of the SAME
# transparent foreground onto this same green (not a separate design), so
# pre-API-26 devices get an identical look to the adaptive icon.
# Android only — iOS is untouched (out of scope for this migration).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo_icon_legacy.png"
  min_sdk_android: 24
  adaptive_icon_background: "#234B35"
  adaptive_icon_foreground: "assets/icon/logo_icon.png"
  adaptive_icon_foreground_inset: 0
